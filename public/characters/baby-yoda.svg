<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-labelledby="title desc">
  <title id="title">Baby Yoda inspired character portrait</title>
  <desc id="desc">A tiny green alien child with enormous sideways ears, glossy dark eyes, forehead folds, and a cream collar over a tan robe.</desc>
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="32%" r="78%">
      <stop offset="0" stop-color="#f4f5e9"/>
      <stop offset="1" stop-color="#dce5d1"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b8db82"/>
      <stop offset="1" stop-color="#739c53"/>
    </linearGradient>
    <linearGradient id="innerEar" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dfaa9b"/>
      <stop offset="1" stop-color="#bd8277"/>
    </linearGradient>
    <radialGradient id="skin" cx="48%" cy="28%" r="78%">
      <stop stop-color="#d4e9a0"/>
      <stop offset=".58" stop-color="#a9cf79"/>
      <stop offset="1" stop-color="#7aa557"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#d7c7a5"/>
      <stop offset="1" stop-color="#9c896b"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#eee4ca"/>
      <stop offset="1" stop-color="#c4b393"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#526a45" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="480" height="640" rx="34" fill="url(#backdrop)"/>
  <circle cx="240" cy="284" r="188" fill="#ffffff" opacity=".2"/>
  <g filter="url(#shadow)">
    <!-- wide green ears -->
    <path d="M166 250C126 220 82 189 28 181 34 225 66 278 120 298c19 7 36 9 54 9l20-34z" fill="url(#ear)" stroke="#66894a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M314 250c40-30 84-61 138-69-6 44-38 97-92 117-19 7-36 9-54 9l-20-34z" fill="url(#ear)" stroke="#66894a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M143 254c-31-27-64-47-96-57 12 34 34 63 80 84 9 4 18 6 28 8z" fill="url(#innerEar)" opacity=".9"/>
    <path d="M337 254c31-27 64-47 96-57-12 34-34 63-80 84-9 4-18 6-28 8z" fill="url(#innerEar)" opacity=".9"/>
    <path d="M75 208c27 11 48 26 66 45M405 208c-27 11-48 26-66 45" fill="none" stroke="#e8b1a0" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <!-- robe and shoulders -->
    <path d="M93 569c9-105 62-161 147-161s138 56 147 161v38H93z" fill="url(#robe)"/>
    <path d="M151 421c14-35 41-58 89-58s75 23 89 58l-29 50H180z" fill="url(#collar)" stroke="#b5a582" stroke-width="4"/>
    <path d="M159 416c8-14 18-22 28-29l13 12-13 14 18 12-13 15-24-10zM321 416c-8-14-18-22-28-29l-13 12 13 14-18 12 13 15 24-10z" fill="#f3ead2" stroke="#b8aa89" stroke-width="3" stroke-linejoin="round"/>
    <path d="m174 414 66 51-45 35-38-61zM306 414l-66 51 45 35 38-61z" fill="#e6dbc0"/>
    <path d="M214 472h52l-13 135h-26z" fill="#b6a381" opacity=".65"/>
    <!-- head -->
    <path d="M126 258c2-76 45-127 114-133 69 6 112 57 114 133 2 60-12 118-43 151-19 21-43 33-71 35-28-2-52-14-71-35-31-33-45-91-43-151z" fill="url(#skin)" stroke="#769d5a" stroke-width="5"/>
    <!-- soft brow and cheeks -->
    <path d="M150 258c12-11 28-17 45-18M285 240c17 1 33 7 45 18" fill="none" stroke="#789b56" stroke-width="8" stroke-linecap="round" opacity=".65"/>
    <path d="M160 229c20-13 42-18 65-15M255 214c23-3 45 2 65 15" fill="none" stroke="#739755" stroke-width="5" stroke-linecap="round" opacity=".42"/>
    <path d="M174 219c8-5 16-8 24-9M282 210c8 1 16 4 24 9" fill="none" stroke="#eff6d5" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="158" cy="327" rx="27" ry="17" fill="#d58e7c" opacity=".22"/>
    <ellipse cx="322" cy="327" rx="27" ry="17" fill="#d58e7c" opacity=".22"/>
    <!-- large, gentle eyes -->
    <ellipse cx="184" cy="292" rx="34" ry="43" fill="#30271f"/>
    <ellipse cx="296" cy="292" rx="34" ry="43" fill="#30271f"/>
    <ellipse cx="184" cy="292" rx="28" ry="37" fill="#100f0d"/>
    <ellipse cx="296" cy="292" rx="28" ry="37" fill="#100f0d"/>
    <ellipse cx="194" cy="278" rx="9" ry="12" fill="#fffdf4" opacity=".96"/>
    <ellipse cx="306" cy="278" rx="9" ry="12" fill="#fffdf4" opacity=".96"/>
    <circle cx="173" cy="306" r="4" fill="#b4c989" opacity=".7"/>
    <circle cx="285" cy="306" r="4" fill="#b4c989" opacity=".7"/>
    <path d="M230 330c5-7 15-7 20 0l-5 10h-10z" fill="#70904e"/>
    <path d="M218 355c12 7 28 7 40 0" fill="none" stroke="#63834b" stroke-width="4" stroke-linecap="round" opacity=".75"/>
    <path d="M146 244c9-69 43-105 94-113 51 8 85 44 94 113-25-25-56-37-94-37s-69 12-94 37z" fill="#c5df91" opacity=".82"/>
  </g>
  <path d="M37 585h406" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>
</svg>
